version: "3.9"

services:
  db:
    image: postgres:16
    container_name: commerce-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: commerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: commerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: commerce-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: commerce-backend
    env_file:
      - ./apps/backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: commerce-frontend
    env_file:
      - ./apps/frontend/.env
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
